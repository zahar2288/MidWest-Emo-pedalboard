name: Build Midwest (macOS arm64)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Collect plugins
        run: |
          mkdir -p out
          find build \( -name "*.vst3" -o -name "*.component" \) -type d -prune -exec cp -R {} out/ \;
          ls -la out
          for f in out/*; do codesign --force --deep -s - "$f"; done
          cd out && zip -r -y ../Midwest-macOS.zip .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Midwest-macOS
          path: Midwest-macOS.zip
